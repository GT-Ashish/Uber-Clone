<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/general.css">
</head>
<body>
    <header>
        <div class="header-first-row">
            <div class="header-first-row-left-section">
                <a class="header-uber-text">
                    Uber
                </a>
                <a class="header-ride-link">
                    Ride
                </a>
                <a class="header-drive-link">
                    Drive
                </a>
                <a class="header-business-link">
                    Business
                </a>
                <button class="header-about-button">
                    About <span><i class="fa fa-chevron-down" aria-hidden="true"></i></span>
                </button>
            </div>
            <div class="header-first-row-right-section">
                <button class="header-language-button">
                   <span><i class="fa-solid fa-globe"></i></span> EN
                </button>
                <a class="header-help-link">
                    Help
                </a>
                <a class="header-log-in-link">
                    Log in
                </a>
                <a class="header-sign-up-link">
                    Sign up
                </a>
            </div>
        </div>
        <div class="header-second-row">
            <div class="header-second-row-left-sectioo">
                <span class="header-second-row-ride-text">Ride</span>
            </div>
            <div class="header-second-row-right-section">
                <a class="header-request-a-ride-link">
                    Request a ride
                </a>
                <a class="header-reserve-a-ride-link">
                    Reserve a ride
                </a>
                <a class="header-see-prices-link">
                    See prices
                </a>
                <a class="header-explore-ride-options-link">
                    Explore ride options
                </a>
                <a class="header-airport-rides-link">
                    Airport rides
                </a>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="column1">
            <div class="city-details">
                <div>
                   <span><i class="fa fa-map-marker" aria-hidden="true"></i></span> Pune,IN
                </div>
                <button>
                    Change city
                </button>
            </div>
            <h1>
                Request a ride for now or later
            </h1>
            <div class="promotional-text">
                <strong>
                    <span><i class="fa fa-tag" aria-hidden="true"></i></span>Up to 50% off your first 5 Uber rides
                </strong>
                <span>
                    .T&Cs apply.* *Valid within 15 days of signup.
                </span>
            </div>
            <div class="searchbars">
                <div class="searchbar1">
                    <span class="dot-icon"><i class="fa fa-circle" aria-hidden="true"></i></span>
                    <input placeholder="Pickup location">
                    <span class="location-icon"><i class="fa fa-location-arrow" aria-hidden="true"></i></span>
                </div>
                <div class="line"></div>
                <div class="searchbar2">
                    <span><i class="fa fa-square" aria-hidden="true"></i></span>
                    <input placeholder="Dropoff location">
                </div>
            </div>
            <a class="link1">
                See Prices
            </a>
            <a class="link2">
                Schedule for later
            </a>
        </div>
        <img src="images/section-1.1.jpg">
    </section>
</body>
</html>
