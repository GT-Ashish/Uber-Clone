<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/general.css">
</head>
<body>
    <header>
        <div class="header-first-row">
            <div class="header-first-row-left-section">
                <a class="header-uber-text">
                    Uber
                </a>
                <a class="header-ride-link">
                    Ride
                </a>
                <a class="header-drive-link">
                    Drive
                </a>
                <a class="header-business-link">
                    Business
                </a>
                <button class="header-about-button">
                    About
                </button>
            </div>
            <div class="header-first-row-right-section">
                <button class="header-language-button">
                    EN
                </button>
                <a class="header-help-link">
                    Help
                </a>
                <a class="header-log-in-link">
                    Log in
                </a>
                <a class="header-sign-up-link">
                    Sign up
                </a>
            </div>
        </div>
        <div class="header-second-row">
            <div class="header-second-row-left-sectioo">
                <span class="header-second-row-ride-text">Ride</span>
            </div>
            <div class="header-second-row-right-section">
                <a class="header-request-a-ride-link">
                    Request a ride
                </a>
                <a class="header-reserve-a-ride-link">
                    Reserve a ride
                </a>
                <a class="header-see-prices-link">
                    See prices
                </a>
                <a class="header-explore-ride-options-link">
                    Explore ride options
                </a>
                <a class="header-airport-rides-link">
                    Airport rides
                </a>
            </div>
        </div>
    </header>
</body>
</html>
